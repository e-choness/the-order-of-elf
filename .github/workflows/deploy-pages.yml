name: Deploy to GitHub Pages

# Optional mirror of the game on GitHub Pages (itch.io is the main home).
# To enable: Settings → Pages → Source "GitHub Actions", then add a repository
# variable ENABLE_PAGES = true (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.ENABLE_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
